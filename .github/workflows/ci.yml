name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: f1, POSTGRES_PASSWORD: f1, POSTGRES_DB: f1test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://f1:f1@localhost:5432/f1test
      F1_DATABASE_URL: postgresql+psycopg://f1:f1@localhost:5432/f1test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: mypy app
      - name: Alembic migrations apply cleanly on PostgreSQL
        run: python -m app.cli migrate
      - run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      F1_DATABASE_URL: sqlite:///${{ github.workspace }}/e2e.db
      F1_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - name: Seed database (synthetic fixture through the real ingestion + training code)
        working-directory: backend
        run: PYTHONPATH=. python scripts/seed_e2e.py
      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: "frontend/playwright-report\nfrontend/test-results\napi.log" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d db backend frontend
      - name: Smoke test through the nginx proxy
        run: |
          for i in $(seq 1 40); do curl -sf localhost:8080/api/health && exit 0; sleep 2; done
          docker compose logs; exit 1
